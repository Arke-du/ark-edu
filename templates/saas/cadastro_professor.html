<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastre-se | ARK EDUS</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef3fa;color:#172033}.page{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:100%;max-width:620px;background:#fff;border-radius:22px;padding:34px;box-shadow:0 20px 55px rgba(18,59,114,.12)}h1{color:#123b72;margin:0 0 8px}.sub{color:#667085;margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #ced8e5;border-radius:11px;font-size:15px}button{width:100%;padding:15px;border:0;border-radius:12px;background:#1f5bd7;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.links{text-align:center;margin-top:18px}.links a{color:#123b72;text-decoration:none;font-weight:700}.flash{padding:12px;border-radius:10px;background:#fff3cd;margin-bottom:16px}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:24px}}</style></head><body><div class="page"><div class="card"><h1>Crie sua conta de professor</h1><p class="sub">Seu espaço individual será criado automaticamente.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post"><div class="grid"><div class="full"><label>Nome completo</label><input name="nome" required></div><div><label>CPF</label><input name="cpf"></div><div><label>Telefone</label><input name="telefone"></div><div class="full"><label>E-mail</label><input type="email" name="email" required></div><div><label>Senha</label><input type="password" name="senha" minlength="6" required></div><div><label>Confirmar senha</label><input type="password" name="confirmar_senha" minlength="6" required></div><div class="full"><label>Plano</label><select name="plano"><option value="gratuito" {% if plano=='gratuito' %}selected{% endif %}>Gratuito — R$ 0/mês</option><option value="professor" {% if plano=='professor' %}selected{% endif %}>Professor — R$ 39,90/mês</option></select></div><div class="full"><button type="submit">Continuar</button></div></div></form><div class="links"><a href="{{ url_for('login') }}">Já tenho conta</a> · <a href="{{ url_for('pagina_planos') }}">Ver planos</a></div></div></div></body></html>
