<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Aguardando | ARK PLAY</title><style>body{font-family:Arial;background:linear-gradient(135deg,#0d2d62,#0786a4);min-height:100vh;display:grid;place-items:center;margin:0}.c{background:#fff;padding:35px;border-radius:22px;text-align:center;max-width:480px}.c h1{color:#0d2d62}.dot{font-size:35px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}</style></head><body><main class="c"><div>🎮 ARK PLAY</div><h1>Você entrou, {{nome}}!</h1><div class="dot">•••</div><p>Aguarde o professor iniciar a atividade.</p><strong>PIN {{codigo}}</strong></main><script>setInterval(async()=>{let r=await fetch('{{url_for('jogos_status_publico',codigo=codigo)}}');let d=await r.json();if(d.status==='iniciada'){let f=document.createElement('form');f.method='post';f.action='{{url_for('jogos_jogar',codigo=codigo)}}';let i=document.createElement('input');i.type='hidden';i.name='nome';i.value={{nome|tojson}};f.appendChild(i);document.body.appendChild(f);f.submit()}if(d.status==='fechada')location.reload()},2000)</script></body></html>
