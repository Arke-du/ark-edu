{% extends "layout/base.html" %}{% block titulo %}Criar jogo | ARK EDUS{% endblock %}{% block conteudo %}<style>.jc{max-width:1050px;margin:auto;padding:28px}.jc-card{background:#fff;border:1px solid #dfe7f2;border-radius:16px;padding:22px;margin-bottom:16px}.jc h1,.jc h2{color:#0d2d62}.jc-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.jc label{display:block;font-size:12px;font-weight:800;color:#40536d;margin-bottom:5px}.jc input,.jc select,.jc textarea{width:100%;padding:11px;border:1px solid #ccd8e7;border-radius:9px;box-sizing:border-box}.item{border:1px solid #e1e9f2;border-radius:12px;padding:14px;margin:10px 0;background:#f8fafc}.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#0d2d62;color:#fff}.secondary{background:#e9f7fb;color:#087f9d}@media(max-width:700px){.jc-grid,.alts{grid-template-columns:1fr}}</style><div class="jc"><h1>Criar atividade</h1><form method="post"><div class="jc-card"><div class="jc-grid"><div><label>Título</label><input name="titulo" required placeholder="Ex.: Revisão de História"></div><div><label>Tipo</label><select name="tipo" id="tipo" onchange="render()"><option value="rapida">Resposta Rápida</option><option value="conecte">Conecte</option><option value="ordem">Coloque em Ordem</option><option value="descubra">Descubra</option></select></div><div><label>Tempo por item</label><input type="number" name="tempo" value="30" min="5" max="300"></div><div><label>Disciplina</label><input name="disciplina"></div><div><label>Turma</label><select name="turma_id"><option value="">Sem turma específica</option>{% for t in turmas %}<option value="{{t.id}}">{{t.nome}}</option>{% endfor %}</select></div></div></div><div class="jc-card"><h2 id="ititle">Conteúdo</h2><div id="items"></div><button class="btn secondary" type="button" onclick="addItem()">+ Adicionar item</button></div><button class="btn primary" type="submit">Salvar atividade</button></form></div><script>
const initial={{ tipo|tojson }};document.getElementById('tipo').value=initial;let n=0;function addItem(){const t=document.getElementById('tipo').value,d=document.createElement('div');d.className='item';let h='';if(t==='rapida'){h=`<label>Pergunta</label><input name="pergunta[]" required><div class="alts">${['A','B','C','D'].map(x=>`<div><label>Alternativa ${x}</label><input name="alt_${n}_${x}"></div>`).join('')}</div><label>Resposta correta</label><select name="correta[]"><option>A</option><option>B</option><option>C</option><option>D</option></select>`}else if(t==='conecte'){h='<label>Item da esquerda</label><input name="esquerda[]" required><label>Correspondência correta</label><input name="direita[]" required>'}else if(t==='ordem'){h='<label>Item na ordem correta</label><input name="ordem_item[]" required>'}else{h='<label>Resposta</label><input name="resposta[]" required><label>Pistas (separe com |)</label><textarea name="pistas[]" placeholder="Pista 1 | Pista 2 | Pista 3"></textarea>'}d.innerHTML=h;document.getElementById('items').appendChild(d);n++}function render(){document.getElementById('items').innerHTML='';n=0;addItem();addItem()}render();
</script>{% endblock %}
