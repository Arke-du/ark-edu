<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Projetar | ARK PLAY</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0d2d62,#0786a4);color:#fff;min-height:100vh;display:grid;place-items:center}.c{text-align:center}.brand{font-size:24px;font-weight:900}.title{font-size:38px;margin:18px}.pin{font-size:82px;font-weight:950;letter-spacing:12px}.qr{background:#fff;padding:12px;border-radius:18px;width:260px}.url{font-size:25px;margin:15px}.count{font-size:28px;font-weight:900}</style></head><body><main class="c"><div class="brand">🎮 ARK PLAY</div><div class="title">{{atividade.titulo}}</div><div>PIN</div><div class="pin">{{atividade.codigo[:3]}} {{atividade.codigo[3:]}}</div><img class="qr" src="{{url_for('jogos_qr',atividade_id=atividade.id)}}"><div class="url">{{request.host_url}}jogar</div><div class="count">👥 <span id="n">0</span> participantes</div><div id="status">{{atividade.sala_status|upper}}</div></main><script>async function u(){let r=await fetch('{{url_for('jogos_participantes_json',atividade_id=atividade.id)}}');if(r.ok){let d=await r.json();n.textContent=d.participantes.length;status.textContent=d.status.toUpperCase()}}u();setInterval(u,3000)</script></body></html>
