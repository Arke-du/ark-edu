<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{atividade.titulo}} | ARK PLAY</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif}.top{background:#0d2d62;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top strong{font-size:18px}.who{font-size:13px;opacity:.9}.wrap{max-width:1200px;margin:18px auto;padding:0 14px}.game{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 35px #0f2d5520}.game iframe{display:block;width:100%;height:min(78vh,820px);min-height:600px;border:0}.foot{text-align:center;color:#64748b;font-size:12px;padding:12px}.full{background:#fff;color:#0d2d62;border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}@media(max-width:700px){.game iframe{min-height:75vh}.top strong{font-size:15px}}</style></head><body><header class="top"><div><strong>🎮 ARK PLAY · {{atividade.titulo}}</strong><div class="who">Jogando como {{nome}}</div></div><button class="full" onclick="document.querySelector('.game').requestFullscreen?.()">⛶ Tela cheia</button></header><main class="wrap"><section class="game"><iframe src="{{wordwall_url}}" allowfullscreen allow="fullscreen; autoplay"></iframe><div class="foot">Atividade incorporada do Wordwall dentro da ARK EDUS.</div></section></main></body></html>
