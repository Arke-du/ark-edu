<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK PLAY | Entrar</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0d2d62,#087f9d);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(480px,100%);background:#fff;border-radius:24px;padding:36px;box-shadow:0 25px 70px #001b3b55;text-align:center}.brand{font-size:14px;font-weight:900;letter-spacing:2px;color:#087f9d}.title{font-size:36px;color:#0d2d62;margin:8px 0}.sub{color:#64748b;margin:0 0 24px}.pin{width:100%;font-size:30px;text-align:center;letter-spacing:8px;padding:15px;border:2px solid #d8e3ef;border-radius:13px;outline:none}.pin:focus{border-color:#087f9d}.btn{width:100%;margin-top:14px;padding:15px;background:#0d2d62;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:900;cursor:pointer}.note{font-size:12px;color:#8492a6;margin-top:18px}</style></head><body><main class="card"><div class="brand">ARK EDUS</div><h1 class="title">🎮 ARK PLAY</h1><p class="sub">Digite o PIN fornecido pelo professor.</p><form method="post"><input class="pin" name="codigo" value="{{codigo}}" required maxlength="8" inputmode="numeric" autocomplete="off" autofocus placeholder="PIN"><button class="btn">ENTRAR</button></form><p class="note">Não é necessário login ou cadastro de aluno.</p></main></body></html>
