<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor de horários | ARK EDUS</title><link rel="icon" href="{{url_for('static',filename='img/logo-arkedus.png')}}"><style>
:root{font-family:Inter,Arial,sans-serif;color:#15304f;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#0a4286,#087fd0);color:white;padding:18px 25px;display:flex;align-items:center;gap:20px;justify-content:space-between}header h1{margin:0;font-size:21px}header small{opacity:.85}.toolbar{display:flex;gap:12px;align-items:center;padding:14px 22px;background:white;border-bottom:1px solid #dbe5f1;flex-wrap:wrap}.toolbar select,.toolbar button{padding:10px 14px;border-radius:9px;border:1px solid #cbd5e1;background:white}.toolbar button{cursor:pointer;color:#0a579c;font-weight:700}.container{padding:18px 22px}.board{background:white;border:1px solid #dbe5f1;border-radius:14px;overflow:auto;max-height:68vh}table{border-collapse:separate;border-spacing:0;width:100%;min-width:920px}th,td{border-right:1px solid #e5edf5;border-bottom:1px solid #e5edf5;padding:6px;min-width:125px;text-align:center}th{position:sticky;top:0;background:#eaf4ff;z-index:2;padding:13px}th:first-child,td:first-child{position:sticky;left:0;background:#f8fbff;z-index:3;min-width:160px;font-weight:700}.cell{border:1px dashed #b6cbe1;border-radius:8px;min-height:50px;padding:6px;cursor:pointer;background:#f8fbff}.cell:hover{border-color:#087fd0;background:#eaf4ff}.card{background:#e3f2fd;color:#07539a;border:1px solid #b8dfff;border-radius:8px;padding:7px;font-weight:750;font-size:12px}.card small{display:block;font-weight:400;font-size:10px;margin-top:4px}.intervalo{background:#f1f5f9;color:#64748b;font-size:12px}.bottom{margin-top:16px;background:white;border:1px solid #dbe5f1;border-radius:14px;padding:18px}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{border:1px solid #b7d6f2;background:#eaf5ff;border-radius:10px;padding:9px 12px;cursor:pointer;color:#07539a;font-weight:700}.chip.active{background:#087fd0;color:white}.chip small{display:block;font-size:11px;font-weight:400}.muted{color:#64748b}#msg{padding:8px 20px;font-weight:650}.error{color:#b91c1c}.success{color:#15803d}@media print{header,.toolbar,.bottom,#msg{display:none}.board{max-height:none}body{background:white}.container{padding:0}} </style></head><body>
<header><div><h1>▦ ARK EDUS · Editor de Horários</h1><small>Montagem em tela inteira · {{turno}}</small></div><strong>ARK EDUS</strong></header>
<div class="toolbar"><label>Turno <select id="turno" onchange="location.href='{{url_for('horarios_novo.editor',escola_id=escola)}}&turno='+encodeURIComponent(this.value)">{% for t in turnos %}<option {% if t==turno %}selected{% endif %}>{{t}}</option>{% endfor %}</select></label><label>Visualização <select id="visao" onchange="render()"><option value="turma">Por turma</option><option value="professor">Por professor</option></select></label><button onclick="window.print()">▤ Imprimir / PDF</button><button onclick="location.reload()">↻ Atualizar</button><a href="{{url_for('horarios_novo.index',escola_id=escola)}}" style="color:#087fd0">Configurações</a></div>
<div id="msg"></div><main class="container"><div class="board" id="board"></div><div class="bottom"><h3>Aulas disponíveis para distribuição</h3><p class="muted">Selecione um cartão e depois clique no quadradinho da turma e do dia. Clique em uma aula existente para substituí-la ou removê-la.</p><label>Turma <select id="filtroTurma" onchange="renderChips()"></select></label><div id="chips" class="chips" style="margin-top:15px"></div></div></main>
<script>
const turmas={{turmas|tojson}},periodos={{periodos|tojson}},vinculos={{vinculos|tojson}},matriz={{matriz|tojson}},alocacoes={{alocacoes|tojson}},editavel={{editavel|tojson}};
const escola={{escola|tojson}},dias=['Segunda','Terça','Quarta','Quinta','Sexta'];let selecionado=null;
const filtro=document.getElementById('filtroTurma');turmas.forEach(t=>filtro.add(new Option(t.rotulo,t.id)));
const key=(tid,pid)=>`${tid}:${pid}`;
function show(s,err=false){const el=document.getElementById('msg');el.textContent=s;el.className=err?'error':'success'}
function label(v){return v.componente.length>22?v.componente.slice(0,21)+'…':v.componente}
function abrevia(nome){return nome.split(/\s+/).map(x=>x[0]).join('').slice(0,5).toUpperCase()}
function renderChips(){let tid=Number(filtro.value),c=document.getElementById('chips');c.innerHTML='';if(!editavel){c.textContent='Visualização somente leitura';return}vinculos.filter(v=>v.turma_id===tid).forEach(v=>{let max=(matriz.find(m=>m.turma_id===tid&&m.componente_id===v.componente_id)||{}).aulas_semanais||0;let usados=alocacoes.filter(a=>a.turma_id===tid&&a.componente_id===v.componente_id).length;let b=document.createElement('button');b.className='chip'+(selecionado&&selecionado.turma_id===tid&&selecionado.componente_id===v.componente_id&&selecionado.professor_id===v.professor_id?' active':'');b.innerHTML=`${abrevia(v.componente)} <small>${v.professor} · ${usados}/${max} aulas</small>`;b.disabled=(!max||usados>=max);b.onclick=()=>{selecionado={...v};renderChips();show('Cartão selecionado: '+v.componente)};c.appendChild(b)});if(!c.children.length)c.textContent='Sem vínculos cadastrados para esta turma. Verifique os usuários e a matriz de aulas.'}
function render(){let visao=document.getElementById('visao').value;let linhas=visao==='turma'?turmas:[...new Map(vinculos.map(v=>[v.professor_id,{id:v.professor_id,rotulo:v.professor}])).values()];let mapa=new Map(alocacoes.map(a=>[key(a.turma_id,a.periodo_id),a]));let html='<table><thead><tr><th>'+(visao==='turma'?'Turmas':'Professores')+'</th>';for(let d=1;d<=5;d++)html+=`<th>${dias[d-1]}</th>`;html+='</tr></thead><tbody>';for(let linha of linhas){let lista=periodos.filter(p=>p.dia===1);for(let p0 of lista){html+=`<tr><td>${escapeHtml(linha.rotulo)}<small style="display:block;color:#64748b">${p0.tipo==='intervalo'?'Intervalo':p0.inicio+' – '+p0.fim}</small></td>`;for(let d=1;d<=5;d++){let p=periodos.find(x=>x.dia===d&&x.ordem===p0.ordem);if(!p){html+='<td></td>';continue}if(p.tipo==='intervalo'){html+='<td class="intervalo">Intervalo</td>';continue}let a=visao==='turma'?mapa.get(key(linha.id,p.id)):alocacoes.find(x=>x.professor_id===linha.id&&x.periodo_id===p.id);let desc=a?`<div class="card">${escapeHtml(visao==='turma'?abrevia(a.componente):turmas.find(t=>t.id===a.turma_id)?.rotulo||'Turma')}<small>${escapeHtml(visao==='turma'?a.professor:a.componente)}</small></div>`:'+';html+=`<td><div class="cell" data-turma="${visao==='turma'?linha.id:a?.turma_id||0}" data-periodo="${p.id}" data-professor="${visao==='professor'?linha.id:0}">${desc}</div></td>`}html+='</tr>'}}html+='</tbody></table>';document.getElementById('board').innerHTML=html;document.querySelectorAll('.cell').forEach(el=>el.onclick=()=>clickCell(el,visao));renderChips()}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function clickCell(el,visao){if(!editavel)return;if(visao!=='turma'){show('Para editar, selecione a visualização por turma.',true);return}let tid=Number(el.dataset.turma),pid=Number(el.dataset.periodo),existente=alocacoes.find(a=>a.turma_id===tid&&a.periodo_id===pid);let v=selecionado;if(v&&v.turma_id!==tid){show('Selecione um cartão desta turma.',true);return}if(!v&&!existente){filtro.value=tid;renderChips();show('Selecione primeiro um cartão da turma.');return}if(!v&&!confirm('Remover esta aula?'))return;let form=new FormData();Object.entries({escola_id:escola,turma_id:tid,periodo_id:pid,componente_id:v?.componente_id||'',professor_id:v?.professor_id||''}).forEach(([k,val])=>form.append(k,val));try{let resp=await fetch('{{url_for('horarios_novo.alocar')}}',{method:'POST',body:form,credentials:'same-origin'});let data=await resp.json();if(!resp.ok)throw Error(data.erro||'Falha ao salvar');location.reload()}catch(e){show(e.message,true)}}
render();
</script></body></html>
