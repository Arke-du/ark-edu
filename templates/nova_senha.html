<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova senha | ARK EDUS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#0f172a}
.area{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:470px;padding:40px;border:1px solid #e2e8f0;border-radius:22px;background:#fff;box-shadow:0 12px 35px rgba(15,23,42,.10)}
.marca{text-align:center;color:#17468f;font-size:13px;font-weight:900;letter-spacing:.12em}
h1{margin:12px 0 8px;color:#17468f;text-align:center;font-size:28px}
p{text-align:center;color:#64748b;margin:0 0 26px;line-height:1.5}
.alerta{margin-bottom:18px;padding:12px 14px;border-radius:12px;font-size:13px}
.alerta.erro{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alerta.sucesso,.alerta.success{background:#ecfdf3;color:#15803d;border:1px solid #bbf7d0}
label{display:block;margin-bottom:8px;color:#0f172a;font-weight:800}
input{width:100%;padding:14px;margin-bottom:20px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;outline:none}
input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#17468f,#2563eb);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.voltar{display:block;margin-top:20px;color:#17468f;text-align:center;font-weight:800;text-decoration:none}
.ajuda{display:block;margin:-12px 0 20px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="area">
    <div class="card">
        <div class="marca">ARK EDUS</div>
        <h1>Criar nova senha</h1>
        <p>Defina uma nova senha para acessar sua conta.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alerta {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}

        <form action="/salvar_senha_usuario" method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="codigo" value="{{ codigo }}">

            <label for="novaSenha">Nova senha</label>
            <input
                id="novaSenha"
                type="password"
                name="nova_senha"
                minlength="6"
                autocomplete="new-password"
                placeholder="Digite a nova senha"
                required
            >
            <span class="ajuda">Use pelo menos 6 caracteres.</span>

            <label for="confirmarSenha">Confirmar nova senha</label>
            <input
                id="confirmarSenha"
                type="password"
                name="confirmar_senha"
                minlength="6"
                autocomplete="new-password"
                placeholder="Digite a senha novamente"
                required
            >

            <button type="submit">Salvar nova senha</button>
        </form>

        <a href="/login" class="voltar">← Voltar para o login</a>
    </div>
</div>
</body>
</html>
