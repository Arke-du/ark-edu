<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK PLAY</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0d2d62,#087f9d);min-height:100vh;display:grid;place-items:center}.card{width:min(92%,480px);background:#fff;border-radius:24px;padding:34px;box-sizing:border-box;text-align:center;box-shadow:0 24px 60px #001b3b55}.brand{font-size:14px;font-weight:900;letter-spacing:2px;color:#087f9d}.pin{display:inline-block;margin:8px 0 20px;padding:7px 13px;background:#edf7fb;border-radius:999px;color:#0d2d62;font-weight:900}.card h1{color:#0d2d62;margin:12px 0 6px}.card p{color:#64748b}.card input{width:100%;box-sizing:border-box;padding:15px;border:2px solid #d8e3ef;border-radius:12px;font-size:18px;margin:12px 0}.card button{width:100%;padding:15px;border:0;border-radius:12px;background:#0d2d62;color:#fff;font-size:16px;font-weight:900;cursor:pointer}</style></head><body><main class="card"><div class="brand">🎮 ARK PLAY</div><h1>{{atividade.titulo}}</h1><div class="pin">PIN {{codigo}}</div><p>Não precisa de login. Digite seu nome para entrar.</p><form method="post"><input name="nome" required maxlength="80" autocomplete="off" placeholder="Seu nome"><button>ENTRAR NO JOGO</button></form></main></body></html>
