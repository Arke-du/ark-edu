services:
  - type: web
    name: ark-edus
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 900 --graceful-timeout 30 --keep-alive 5 --max-requests 300 --max-requests-jitter 30
    disk:
      name: ark-edus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/plataforma.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: RENDER_DISK_PATH
        value: /var/data

      - key: BACKUP_INCLUDE_UPLOADS
        value: "false"
      - key: BACKUP_RETENTION_DAYS
        value: "3"
